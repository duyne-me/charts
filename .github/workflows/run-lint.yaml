name: Lint and Test Helm Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/run-lint.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/run-lint.yaml'

jobs:
  lint-helm-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install chart-testing (ct)
        uses: helm/chart-testing-action@v2.6.1

      - name: Lint charts with Helm
        run: |
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm lint "$chart"
            fi
          done

      - name: Lint charts with chart-testing (ct)
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            ct lint --config .github/ci/ct.yaml --target-branch "${TARGET_BRANCH}"
          else
            echo "origin/${TARGET_BRANCH} is unavailable. Running full ct lint fallback."
            ct lint --all
          fi

      - name: Generate Helm docs
        run: |
            docker run --rm --volume "${{ github.workspace }}/charts:/helm-docs" jnorwood/helm-docs:latest --chart-search-root=/helm-docs

      - name: Check for uncommitted changes (docs)
        run: |
          git diff --exit-code || (echo "Helm docs are not up to date. Please run helm-docs." && exit 1)
