name: Chart Render Validation

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart-validate.yaml"
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/chart-validate.yaml"

jobs:
  render-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Render charts
        run: |
          mkdir -p .rendered
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              chart_name=$(basename "$chart")
              echo "Rendering $chart_name"
              helm template "$chart_name" "$chart" > ".rendered/${chart_name}.yaml"
            fi
          done

      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          for manifest in .rendered/*.yaml; do
            echo "Validating $manifest"
            kubeconform \
              -strict \
              -ignore-missing-schemas \
              "$manifest"
          done
